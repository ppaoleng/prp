<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>ประกาศคะแนน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* ============ Tokens — สว่างเป็นค่าเริ่มต้นของ CSS, มืดเลือกด้วย data-theme หรือระบบ ============ */
:root {
  --font: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  --bg: #eef1f8;
  --glow-1: rgba(42, 120, 214, .22);
  --glow-2: rgba(98, 80, 214, .15);
  --glow-3: rgba(27, 175, 122, .10);
  --grid-line: rgba(11, 11, 11, .045);
  --card: rgba(255, 255, 255, .74);
  --card-solid: #fcfcfb;
  --card-hover: rgba(255, 255, 255, .92);
  --stroke: rgba(11, 11, 11, .10);
  --stroke-2: rgba(11, 11, 11, .20);
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #6b6963;
  --gridline: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #2a78d6;
  --accent-2: #6da7ec;
  --track: rgba(42, 120, 214, .16);
  --btn-grad: linear-gradient(135deg, #2a78d6 0%, #6250d6 100%);
  --bar-muted: #898781;
  --good: #0ca30c;
  --good-bg: rgba(12, 163, 12, .11);
  --bad: #d03b3b;
  --bad-bg: rgba(208, 59, 59, .09);
  --warn: #c98500;
  --warn-bg: rgba(250, 178, 25, .16);
  --input-bg: rgba(255, 255, 255, .85);
  --shadow: 0 18px 50px -20px rgba(20, 32, 70, .30), 0 1px 0 rgba(255, 255, 255, .6) inset;
  --focus: 0 0 0 3px rgba(42, 120, 214, .35);
  --glow: 0 0 0 rgba(0, 0, 0, 0);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #070a14;
    --glow-1: rgba(57, 135, 229, .32);
    --glow-2: rgba(144, 133, 233, .22);
    --glow-3: rgba(25, 158, 112, .14);
    --grid-line: rgba(255, 255, 255, .05);
    --card: rgba(255, 255, 255, .05);
    --card-solid: #0e1322;
    --card-hover: rgba(255, 255, 255, .08);
    --stroke: rgba(255, 255, 255, .10);
    --stroke-2: rgba(255, 255, 255, .20);
    --text: #f0efec;
    --text-2: #c3c2b7;
    --muted: #9b998f;
    --gridline: rgba(255, 255, 255, .07);
    --axis: rgba(255, 255, 255, .18);
    --accent: #3987e5;
    --accent-2: #86b6ef;
    --track: rgba(57, 135, 229, .22);
    --bar-muted: #5f6370;
    --good-bg: rgba(12, 163, 12, .16);
    --bad-bg: rgba(208, 59, 59, .16);
    --warn: #fab219;
    --warn-bg: rgba(250, 178, 25, .12);
    --input-bg: rgba(255, 255, 255, .06);
    --shadow: 0 22px 60px -24px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .06) inset;
    --focus: 0 0 0 3px rgba(57, 135, 229, .45);
    --glow: 0 0 28px rgba(57, 135, 229, .45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070a14;
  --glow-1: rgba(57, 135, 229, .32);
  --glow-2: rgba(144, 133, 233, .22);
  --glow-3: rgba(25, 158, 112, .14);
  --grid-line: rgba(255, 255, 255, .05);
  --card: rgba(255, 255, 255, .05);
  --card-solid: #0e1322;
  --card-hover: rgba(255, 255, 255, .08);
  --stroke: rgba(255, 255, 255, .10);
  --stroke-2: rgba(255, 255, 255, .20);
  --text: #f0efec;
  --text-2: #c3c2b7;
  --muted: #9b998f;
  --gridline: rgba(255, 255, 255, .07);
  --axis: rgba(255, 255, 255, .18);
  --accent: #3987e5;
  --accent-2: #86b6ef;
  --track: rgba(57, 135, 229, .22);
  --bar-muted: #5f6370;
  --good-bg: rgba(12, 163, 12, .16);
  --bad-bg: rgba(208, 59, 59, .16);
  --warn: #fab219;
  --warn-bg: rgba(250, 178, 25, .12);
  --input-bg: rgba(255, 255, 255, .06);
  --shadow: 0 22px 60px -24px rgba(0, 0, 0, .8), 0 1px 0 rgba(255, 255, 255, .06) inset;
  --focus: 0 0 0 3px rgba(57, 135, 229, .45);
  --glow: 0 0 28px rgba(57, 135, 229, .45);
}

/* ============ Base ============ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
  font: 400 15px/1.65 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 10px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* พื้นหลัง: แสงออโรร่า + ตารางจาง */
.aurora { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .9; will-change: transform; }
.aurora i:nth-child(1) { width: 56vmax; height: 56vmax; left: -14vmax; top: -22vmax; background: radial-gradient(closest-side, var(--glow-1), transparent); animation: drift1 26s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { width: 48vmax; height: 48vmax; right: -16vmax; top: 6vmax; background: radial-gradient(closest-side, var(--glow-2), transparent); animation: drift2 32s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { width: 44vmax; height: 44vmax; left: 22vmax; bottom: -26vmax; background: radial-gradient(closest-side, var(--glow-3), transparent); animation: drift1 38s ease-in-out infinite alternate-reverse; }
.grid-bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 52px 52px;
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 75%);
  mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 0%, transparent 75%);
}
@keyframes drift1 { to { transform: translate3d(7vmax, 5vmax, 0) scale(1.08); } }
@keyframes drift2 { to { transform: translate3d(-8vmax, 6vmax, 0) scale(.94); } }

.app { width: 100%; max-width: 1180px; margin: 0 auto; padding: 18px 16px 56px; }

/* ============ Top bar ============ */
.topbar { display: flex; align-items: center; gap: 12px; padding: 6px 0 18px; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
.logo { width: 38px; height: 38px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--btn-grad); box-shadow: var(--glow), 0 8px 20px -8px rgba(42, 120, 214, .6); }
.logo svg { width: 22px; height: 22px; }
.brand b { display: block; font-weight: 600; font-size: 16px; letter-spacing: .1px; line-height: 1.25; }
.brand span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-user { display: flex; align-items: center; gap: 9px; padding: 5px 6px 5px 12px; border: 1px solid var(--stroke); background: var(--card); border-radius: 999px; backdrop-filter: blur(12px); max-width: 52vw; }
.chip-user .who { min-width: 0; line-height: 1.4; }
.chip-user .who b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-user .who span { display: block; font-size: 11.5px; color: var(--muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--stroke); background: var(--card); display: grid; place-items: center; backdrop-filter: blur(12px); transition: background .2s, border-color .2s, transform .15s; color: var(--text-2); flex: none; }
.icon-btn:hover { background: var(--card-hover); border-color: var(--stroke-2); color: var(--text); }
.icon-btn:active { transform: scale(.95); }
.icon-btn svg { width: 18px; height: 18px; }
.chip-user .icon-btn { width: 30px; height: 30px; border-radius: 999px; }

/* ============ Cards ============ */
.card {
  position: relative; background: var(--card); border: 1px solid var(--stroke); border-radius: 22px; padding: 20px;
  backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: var(--shadow);
}
.card h2 { font-size: 15px; font-weight: 600; letter-spacing: .1px; display: flex; align-items: center; gap: 8px; }
.card .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.kicker { font-size: 12px; letter-spacing: .6px; color: var(--muted); font-weight: 500; }
.rise { opacity: 0; transform: translateY(12px); animation: rise .6s cubic-bezier(.2, .7, .2, 1) forwards; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes rise { to { opacity: 1; transform: none; } }

/* ============ Buttons / forms ============ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 600; font-size: 15px; transition: transform .15s, box-shadow .2s, filter .2s; }
.btn-primary { background: var(--btn-grad); color: #fff; box-shadow: 0 10px 26px -10px rgba(66, 90, 214, .75); }
.btn-primary:hover { filter: brightness(1.08); box-shadow: 0 14px 30px -10px rgba(66, 90, 214, .9); }
.btn-primary:active { transform: translateY(1px) scale(.99); }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn-ghost { background: var(--card); border: 1px solid var(--stroke); color: var(--text-2); padding: 7px 12px; font-size: 13px; font-weight: 500; border-radius: 11px; }
.btn-ghost:hover { background: var(--card-hover); color: var(--text); border-color: var(--stroke-2); }
.btn-ghost[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.auth { display: grid; grid-template-columns: 1.05fr 1fr; gap: 28px; align-items: center; min-height: calc(100vh - 150px); }
.auth-hero { padding: 10px 6px; }
.auth-hero .eyebrow { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--text-2); padding: 5px 12px; border: 1px solid var(--stroke); border-radius: 999px; background: var(--card); backdrop-filter: blur(10px); }
.auth-hero .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); }
.auth-hero h1 { font-size: clamp(34px, 5.4vw, 56px); line-height: 1.12; font-weight: 700; margin: 18px 0 12px; letter-spacing: -.3px; }
.auth-hero h1 em { font-style: normal; background: linear-gradient(100deg, var(--accent-2), #9085e9 60%, #6da7ec); -webkit-background-clip: text; background-clip: text; color: transparent; }
.auth-hero p { color: var(--text-2); max-width: 46ch; font-size: 16px; }
.auth-points { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.auth-points li { display: flex; gap: 11px; align-items: flex-start; color: var(--text-2); font-size: 14px; }
.auth-points svg { width: 18px; height: 18px; flex: none; margin-top: 3px; color: var(--accent-2); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--input-bg); border: 1px solid var(--stroke); margin-bottom: 20px; }
.seg button { border: 0; background: transparent; padding: 9px; border-radius: 10px; font-weight: 500; color: var(--muted); transition: all .2s; }
.seg button[aria-selected="true"] { background: var(--card-solid); color: var(--text); box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--text-2); font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted); }
.input-wrap { position: relative; }
.input { width: 100%; padding: 12px 14px; border-radius: 13px; border: 1px solid var(--stroke); background: var(--input-bg); transition: border-color .2s, box-shadow .2s; font-size: 16px; }
.input::placeholder { color: var(--muted); opacity: .8; }
.input:hover { border-color: var(--stroke-2); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
.input-wrap .toggle-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: 0; background: transparent; color: var(--muted); border-radius: 9px; display: grid; place-items: center; }
.input-wrap .toggle-eye:hover { color: var(--text); }
.input-wrap .toggle-eye svg { width: 18px; height: 18px; }
.input-wrap .input.has-eye { padding-right: 44px; }
.strength { display: flex; gap: 4px; margin-top: 2px; }
.strength i { flex: 1; height: 4px; border-radius: 4px; background: var(--stroke); transition: background .25s; }
.strength[data-s="1"] i:nth-child(-n+1) { background: var(--bad); }
.strength[data-s="2"] i:nth-child(-n+2) { background: var(--warn); }
.strength[data-s="3"] i:nth-child(-n+3) { background: var(--accent); }
.strength[data-s="4"] i { background: var(--good); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 13px; font-size: 14px; margin-bottom: 14px; border: 1px solid transparent; }
.alert svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }
.alert-err { background: var(--bad-bg); border-color: rgba(208, 59, 59, .4); }
.alert-err svg { color: var(--bad); }
.alert-info { background: var(--warn-bg); border-color: rgba(250, 178, 25, .35); }
.alert-info svg { color: var(--warn); }
.alert-ok { background: var(--good-bg); border-color: rgba(12, 163, 12, .35); }
.alert-ok svg { color: var(--good); }
.fine { font-size: 12.5px; color: var(--muted); margin-top: 14px; text-align: center; }

/* ============ Dashboard ============ */
.hero { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 16px; }
.hero > .card:not(.score-card) { display: flex; flex-direction: column; }
.score-card { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; overflow: hidden; }
.score-card::before { content: ""; position: absolute; width: 260px; height: 260px; left: -70px; top: -90px; background: radial-gradient(closest-side, var(--glow-1), transparent); pointer-events: none; }
.ring { position: relative; width: 176px; height: 176px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .trk { stroke: var(--track); }
.ring .bar { stroke: url(#ringGrad); stroke-linecap: round; filter: drop-shadow(0 0 7px rgba(57, 135, 229, .55)); transition: stroke-dashoffset 1.2s cubic-bezier(.2, .8, .2, 1); }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.hero-figure { font-size: 58px; line-height: 1; font-weight: 700; letter-spacing: -1.5px; }
.ring .of { font-size: 13px; color: var(--muted); margin-top: 4px; }
.score-meta h2 { display: block; font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .4px; }
.score-meta .name { font-size: 20px; font-weight: 600; margin: 4px 0 2px; line-height: 1.3; }
.score-meta .id { font-size: 13px; color: var(--muted); }
.delta { display: inline-flex; align-items: center; gap: 7px; margin-top: 12px; font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: var(--card-hover); border: 1px solid var(--stroke); }
.delta svg { width: 14px; height: 14px; flex: none; }
.delta.up svg { color: var(--good); }
.delta.down svg { color: var(--bad); }
.note-pill { margin-top: 10px; font-size: 12px; color: var(--text-2); }
.rank-fig { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 4px; }
.rank-fig b { font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
.rank-fig span { color: var(--muted); font-size: 15px; }
.pos { margin: 14px 0 8px; position: relative; height: 8px; border-radius: 8px; background: var(--track); }
.pos i { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--accent); border: 2px solid var(--card-solid); box-shadow: var(--glow); transition: left 1.1s cubic-bezier(.2, .8, .2, 1); }
.pos-ends { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.lead { font-size: 14px; color: var(--text-2); }
.lead b { color: var(--text); font-weight: 600; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 12px; }
.stat { padding: 10px 12px; border-radius: 14px; background: var(--card-hover); border: 1px solid var(--stroke); }
.stat span { display: block; font-size: 12px; color: var(--muted); }
.stat b { font-size: 20px; font-weight: 600; letter-spacing: -.3px; }

.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 16px; }
.tile { padding: 16px; }
.tile .lab { font-size: 13px; color: var(--text-2); font-weight: 500; }
.tile .val { margin: 8px 0 10px; display: flex; align-items: baseline; gap: 5px; }
.tile .val b { font-size: 30px; font-weight: 700; letter-spacing: -.6px; line-height: 1; }
.tile .val span { font-size: 13px; color: var(--muted); }
.meter { position: relative; height: 8px; border-radius: 8px; background: var(--track); }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: var(--accent); width: 0; transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
.meter .avg { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .85; border-radius: 2px; transform: translateX(-1px); }
.tile .cap { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); align-items: center; }
.legend i { display: inline-block; vertical-align: -1px; margin-right: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.sw.mut { background: var(--bar-muted); }
.sw.tick { width: 2px; height: 12px; border-radius: 2px; background: var(--text); }

.two { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; margin-top: 16px; }
.section { margin-top: 16px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font); fill: var(--muted); font-size: 11.5px; }
.chart .ytxt { text-anchor: end; }
.chart .grid { stroke: var(--gridline); stroke-width: 1; }
.chart .base { stroke: var(--axis); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: default; }
.chart .band { fill: var(--track); opacity: 0; transition: opacity .15s; }
.chart g.b:hover .band, .chart g.b:focus .band { opacity: 1; }
.chart g.b:focus-visible { box-shadow: none; }
.chart .you-tag { fill: var(--text); font-weight: 600; font-size: 12px; text-anchor: middle; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th, .tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--stroke); }
.tbl th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.me td { font-weight: 600; background: var(--track); }

.lb { display: grid; gap: 6px; max-height: 360px; overflow: auto; padding-right: 4px; margin: 0; list-style: none; padding-left: 0; }
.lb li { display: grid; grid-template-columns: 34px 1fr 52px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 12px; border: 1px solid transparent; font-size: 13.5px; }
.lb li.me { background: var(--track); border-color: var(--accent); }
.lb .rk { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-weight: 500; }
.lb li.me .rk { color: var(--text); font-weight: 700; }
.lb .bar { position: relative; height: 8px; border-radius: 8px; background: var(--gridline); overflow: visible; }
.lb .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--bar-muted); }
.lb li.me .bar i { background: var(--accent); box-shadow: var(--glow); }
.lb .sc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.lb .tag { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #fff; margin-left: 8px; }

/* ปรนัยรายข้อ */
.sumrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-size: 13px; border: 1px solid var(--stroke); background: var(--card-hover); }
.pill b { font-weight: 600; }
.pill svg { width: 14px; height: 14px; }

          '<p>ตรวจดูคะแนนของตนเองได้ทุกที่ ทุกเวลา ด้วยรหัสนักศึกษาและรหัสผ่านที่ท่านตั้งเอง</p>' +
          '<ul class="auth-points">' +

            '<li>' + ICON.file + '<span>ดูไฟล์ PDF กระดาษคำตอบที่ตรวจแล้วได้ในหน้าเดียว</span></li>' +

  function strengthScore(pw) {
    var s = 0;
    if (pw.length >= 8) s++;
    if (pw.length >= 12) s++;
    if (/[A-Za-z฀-๿]/.test(pw) && /[0-9]/.test(pw)) s++;
    if (/[^A-Za-z0-9฀-๿]/.test(pw) || (/[a-z]/.test(pw) && /[A-Z]/.test(pw))) s++;
    return Math.min(4, s);
  }

  function wireEyes() {
    Array.prototype.forEach.call(app.querySelectorAll('[data-eye]'), function (b) {
      b.addEventListener('click', function () {
        var inp = document.getElementById(b.getAttribute('data-eye'));
        var show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        b.innerHTML = show ? ICON.eyeOff : ICON.eye;
      });
    });
  }

  function wireAuth() {
    var tabs = app.querySelectorAll('[data-tab]');
    Array.prototype.forEach.call(tabs, function (b) {
      b.addEventListener('click', function () { state.authTab = b.getAttribute('data-tab'); renderAuth(); });
    });
    wireEyes();
    var pw = document.getElementById('f_pw'), st = document.getElementById('strength');
    if (pw && st) pw.addEventListener('input', function () { st.setAttribute('data-s', String(strengthScore(pw.value))); });

    var form = document.getElementById('authForm');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var login = state.authTab === 'login';
      var v = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
      var payload = { studentId: v('f_id').trim(), password: v('f_pw') };
      if (!payload.studentId || !payload.password) return setMsg('กรุณากรอกรหัสนักศึกษาและรหัสผ่าน');
      if (!login) {
        if (BOOT.registerVerify === 'code') { payload.code = v('f_code').trim(); if (!payload.code) return setMsg('กรุณากรอกรหัสยืนยัน'); }
        else { payload.name = v('f_name').trim(); if (!payload.name) return setMsg('กรุณากรอกชื่อ-สกุล'); }
        if (payload.password !== v('f_pw2')) return setMsg('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
      }
      busy(true);
      callApi(login ? 'api_login' : 'api_register', payload).then(function (r) {
        busy(false);
        if (!r || !r.ok) return setMsg((r && r.error) || NET_ERR);
        state.token = r.token;
        store.set('sp_token', r.token);
        loadDashboard();
      }).catch(function () { busy(false); setMsg(NET_ERR); });
    });
  }
  function setMsg(m, kind) {
    var el = document.getElementById('msg');
    if (el) el.innerHTML = m ? '<div class="alert alert-' + (kind || 'err') + '">' + ICON.alert + '<div>' + esc(m) + '</div></div>' : '';
  }
  function busy(on) {
    var b = document.getElementById('submitBtn');
    if (!b) return;
    b.disabled = on;
    if (on) { b.setAttribute('data-label', b.textContent); b.innerHTML = '<span class="spin"></span> กรุณารอสักครู่…'; }
    else b.textContent = b.getAttribute('data-label') || 'ตกลง';
  }

  /* ---------- โหลด Dashboard ---------- */

  function renderLoading() {
    app.innerHTML = topbar(null) +
      '<div class="hero"><div class="card sk" style="height:220px"></div><div class="card sk" style="height:220px"></div><div class="card sk" style="height:220px"></div></div>' +
      '<div class="tiles">' + [1, 2, 3, 4, 5].map(function () { return '<div class="card sk" style="height:130px"></div>'; }).join('') + '</div>';
    wireTopbar();
  }

  function clearSession() { state.token = null; store.del('sp_token'); }

  function loadDashboard() {
    renderLoading();
    callApi('api_dashboard', state.token).then(function (r) {
      if (!r || !r.ok) {
        if (r && r.expired) { clearSession(); return renderAuth('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง', 'info'); }
        return renderFatal((r && r.error) || NET_ERR);
      }
      if (r.notice != null) state.notice = r.notice;
      if (!r.published) return renderLocked(r);
      state.course = r.course;
      renderDashboard(r.data);
    }).catch(function () { renderFatal(NET_ERR); });
  }

  function renderFatal(msg) {
    app.innerHTML = topbar(null) +
      '<div class="card locked rise"><div class="lock">' + ICON.alert + '</div><h2>ไม่สามารถแสดงผลได้</h2><p>' + esc(msg) + '</p>' +
      '<div style="margin-top:18px;display:flex;gap:10px;justify-content:center"><button class="btn btn-primary" id="retry">ลองอีกครั้ง</button>' +
      '<button class="btn btn-ghost" id="out2">ออกจากระบบ</button></div></div>';
    wireTopbar();
    document.getElementById('retry').addEventListener('click', loadDashboard);
    document.getElementById('out2').addEventListener('click', logout);
  }

  function renderLocked(r) {
    app.innerHTML = topbar(r.student) +
      '<div class="card locked rise"><div class="lock">' + ICON.lock + '</div>' +
      '<h2>ลงทะเบียนเรียบร้อย — ยังไม่เปิดประกาศผล</h2>' +
      '<p>สวัสดี ' + esc(r.student.name) + '<br>ผลคะแนนจะแสดงที่หน้านี้เมื่อผู้สอนเปิดประกาศผล กลับมาเข้าสู่ระบบด้วยรหัสผ่านที่ตั้งไว้ได้ตลอดเวลา</p>' +
      (r.notice ? '<div class="alert alert-info" style="margin:16px 0 0;text-align:left">' + ICON.alert + '<div>' + esc(r.notice) + '</div></div>' : '') +
      '<div style="margin-top:18px"><button class="btn btn-ghost" id="refresh">ตรวจสอบอีกครั้ง</button></div></div>';
    wireTopbar();
    document.getElementById('refresh').addEventListener('click', loadDashboard);
  }

  function logout() {
    var t = state.token;
    clearSession();
    state.pdf = null;
    if (t) callApi('api_logout', t).catch(function () { /* ไม่เป็นไร */ });
    state.authTab = 'login';
    renderAuth('ออกจากระบบแล้ว', 'ok');

  /* ---------- Dashboard ---------- */

  function meter(score, max, mean, tipText) {
    return '<div class="meter"' + (tipText ? ' data-tip="' + esc(tipText) + '" tabindex="0"' : '') + '>' +
      '<div class="fill" data-w="' + pct(score, max).toFixed(1) + '"></div>' +
      (mean != null ? '<div class="avg" style="left:' + pct(mean, max).toFixed(1) + '%"></div>' : '') + '</div>';
  }

  function tile(c, i) {
    var tipText = c.label + '\n' + YOU() + ' ' + fmt(c.score) + ' / ' + fmt(c.max) + '\nค่าเฉลี่ยห้อง ' + fmt(c.mean) + '\nสูงสุด ' + fmt(c.best) + ' · ต่ำสุด ' + fmt(c.low);
    return '<div class="card tile rise" style="--i:' + (3 + i) + '">' +
      '<div class="lab">' + esc(c.label) + '</div>' +
      '<div class="val"><b data-count="' + (c.score == null ? '' : c.score) + '">' + (c.score == null ? '–' : '0') + '</b><span>/ ' + fmt(c.max) + '</span></div>' +
      meter(c.score, c.max, c.mean, tipText) +
      '<div class="cap"><span>เฉลี่ย ' + fmt(c.mean) + '</span><span>สูงสุด ' + fmt(c.best) + '</span></div></div>';
  }

  function renderDashboard(d) {
    var t = d.total, me = d.student;
    var diff = t.score != null && t.mean != null ? t.score - t.mean : null;
    var dir = diff == null ? 'eq' : diff > 0.004 ? 'up' : diff < -0.004 ? 'down' : 'eq';
    var deltaText = diff == null ? '' : dir === 'eq' ? 'เท่ากับค่าเฉลี่ยของห้อง' :
      (dir === 'up' ? 'สูงกว่า' : 'ต่ำกว่า') + 'ค่าเฉลี่ยของห้อง ' + fmt(Math.abs(diff)) + ' คะแนน';
    var C = 2 * Math.PI * 76;
    var rankFrac = t.of > 1 ? 1 - (t.rank - 1) / (t.of - 1) : 0.5;
    var topPct = t.rank && t.of ? Math.ceil((t.rank / t.of) * 100) : null;

    var h = state.adminView ? topbar(null, { admin: true, back: true }) + adminBar(state.adminView) : topbar(me);
    h += '<main>';
    h += '<div class="hero">';

    h += '<section class="card score-card rise" style="--i:0">' +
      '<div class="ring" role="img" aria-label="คะแนนรวม ' + fmt(t.score) + ' จาก ' + fmt(t.max) + '">' +
        '<svg viewBox="0 0 176 176"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" style="stop-color:var(--accent-2)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs>' +
        '<circle class="trk" cx="88" cy="88" r="76" fill="none" stroke-width="14"/>' +
        '<circle class="bar" cx="88" cy="88" r="76" fill="none" stroke-width="14" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + C.toFixed(2) + '" data-ring="' + (C * (1 - pct(t.score, t.max) / 100)).toFixed(2) + '"/></svg>' +
        '<div class="mid"><b class="hero-figure" data-count="' + (t.score == null ? '' : t.score) + '">' + (t.score == null ? '–' : '0') + '</b><span class="of">จาก ' + fmt(t.max) + ' คะแนน</span></div>' +
      '</div>' +
      '<div class="score-meta"><h2>' + esc(t.label) + '</h2>' +
        '<div class="name">' + esc(me.name) + '</div><div class="id">รหัส ' + esc(me.id) + (me.group ? ' · ' + esc(me.group) : '') + '</div>' +
        (deltaText ? '<div class="delta ' + dir + '">' + ICON[dir] + '<span>' + deltaText + '</span></div>' : '') +
        (t.note ? '<div class="note-pill">' + esc(t.note) + '</div>' : '') +
      '</div></section>';

    h += '<section class="card rise" style="--i:1"><div class="kicker">อันดับในห้อง</div>' +
      '<div class="rank-fig"><b data-count="' + (t.rank == null ? '' : t.rank) + '">' + (t.rank == null ? '–' : '0') + '</b><span>จาก ' + fmt(t.of, 0) + ' คน' + (t.ties ? ' · เสมอกับอีก ' + t.ties + ' คน' : '') + '</span></div>' +
      '<div class="pos" role="img" aria-label="ตำแหน่งในห้อง"><i style="left:0%" data-left="' + (rankFrac * 100).toFixed(1) + '"></i></div>' +
      '<div class="pos-ends"><span>ท้ายตาราง</span><span>สูงสุดของห้อง</span></div>' +
      '<p class="lead" style="margin-top:14px">' +
        (t.percentAbove != null ? 'สูงกว่าเพื่อน <b>' + t.percentAbove + '%</b> ของห้อง' : 'ห้องนี้มีผู้สอบคนเดียว') +
        (topPct != null && t.of > 1 ? '<br>อยู่ใน <b>' + topPct + '%</b> แรกของห้อง' : '') + '</p></section>';

    h += '<section class="card rise" style="--i:2"><div class="kicker">สถิติทั้งห้อง</div><div class="stats">' +
      [['ค่าเฉลี่ย', t.mean], ['มัธยฐาน', t.median], ['สูงสุด', t.best], ['ต่ำสุด', t.low], ['ส่วนเบี่ยงเบนมาตรฐาน', t.sd], ['ผู้เข้าสอบ', t.of]]
        .map(function (s) { return '<div class="stat"><span>' + s[0] + '</span><b>' + (s[0] === 'ผู้เข้าสอบ' ? fmt(s[1], 0) + ' คน' : fmt(s[1])) + '</b></div>'; }).join('') +
      '</div></section>';
    h += '</div>';

    h += '<div class="tiles">' + d.components.concat([d.written]).map(tile).join('') + '</div>';
    h += '<div class="legend" style="margin-top:10px"><span><i class="sw"></i>คะแนนของ' + YOU() + '</span><span><i class="sw tick"></i>ค่าเฉลี่ยของห้อง</span></div>';

    if (d.distribution || d.leaderboard) {
      h += '<div class="two">';
      if (d.distribution) {
        h += '<section class="card rise" style="--i:8"><div class="card-head"><div><h2>การกระจายคะแนนของห้อง</h2>' +
          '<div class="sub">จำนวนนักศึกษาในแต่ละช่วงคะแนนรวม (ช่วงละ ' + d.distribution.width + ' คะแนน)</div></div>' +
          '<div class="pdf-bar"><button class="btn btn-ghost" id="histTbl" aria-pressed="false">ดูเป็นตาราง</button></div></div>' +
          '<div class="legend" style="margin-bottom:6px"><span><i class="sw"></i>' + (d.distribution.you >= 0 ? 'ช่วงคะแนนของ' + YOU() : 'จำนวนนักศึกษา') + '</span><span><i class="sw mut"></i>ช่วงอื่น</span></div>' +
          '<div class="chart" id="hist"></div><div id="histTable" hidden></div></section>';
      }
      if (d.leaderboard) {
        h += '<section class="card rise" style="--i:9"><div class="card-head"><div><h2>อันดับของห้อง</h2><div class="sub">เรียงตามคะแนนรวม · ไม่แสดงชื่อผู้อื่น</div></div></div>' +
          '<ol class="lb">' + d.leaderboard.map(function (r) {
            return '<li class="' + (r.you ? 'me' : '') + '"><span class="rk">' + r.rank + '</span><span class="bar"><i style="width:' + pct(r.score, d.total.max).toFixed(1) + '%"></i></span>' +
              '<span class="sc">' + fmt(r.score) + (r.you ? '<span class="tag">' + YOU() + '</span>' : '') + '</span></li>';
          }).join('') + '</ol></section>';
      }
      h += '</div>';
    }

    if (d.mcq) h += mcqSection(d.mcq);
    if (d.writtenDetail) h += writtenSection(d.writtenDetail);
    if (d.feedback && d.feedback.length) {
      h += '<section class="card section rise" style="--i:12"><div class="card-head"><div><h2>ความเห็นรายข้อ</h2></div></div><ul class="fb">' +
        d.feedback.map(function (f) { return '<li><span class="sc">' + esc(f.scope) + '</span><div>' + esc(f.text) + '</div></li>'; }).join('') + '</ul></section>';
    }
    if (d.hasPdf) {
      h += '<section class="card section rise" style="--i:13" id="pdfCard"><div class="card-head"><div><h2>กระดาษคำตอบที่ตรวจแล้ว</h2><div class="sub" id="pdfName">ไฟล์ PDF ของ' + YOU() + '</div></div>' +
        '<div class="pdf-bar" id="pdfBar" hidden><button class="btn btn-ghost" id="zOut" aria-label="ย่อ">−</button><span class="zoom" id="zVal">100%</span>' +
        '<button class="btn btn-ghost" id="zIn" aria-label="ขยาย">+</button><button class="btn btn-ghost" id="dlBtn">' + ICON.dl.replace('<svg', '<svg width="15" height="15"') + ' ดาวน์โหลด</button></div></div>' +
        '<div class="pdf-stage" id="pdfStage"><div class="sk" style="height:300px;width:100%"></div></div></section>';
    }
    h += '</main><p class="foot">ข้อมูล ณ ' + esc(new Date(d.builtAt).toLocaleString('th-TH')) + (state.notice ? ' · ' + esc(state.notice) : '') + '</p>';

    app.innerHTML = h;
    wireTopbar();
    animate(app);
    if (d.distribution) setupHist(d);
    wireMcq(d.mcq);
    if (d.hasPdf) setupPdf();
  }

  /* ---------- ปรนัย ---------- */

  var GLYPH = { correct: ICON.check, wrong: ICON.x, blank: ICON.dash };
  var RESULT_TH = { correct: 'ถูก', wrong: 'ผิด', blank: 'ไม่ตอบ' };

  function mcqSection(m) {
    var cnt = { correct: 0, wrong: 0, blank: 0 };
    m.items.forEach(function (i) { cnt[i.result]++; });
    var P = m.points;
    var raw = cnt.correct * P.correct + cnt.wrong * P.wrong + cnt.blank * P.blank;
    function stat(kind, glyph, label, n, pts) {
      return '<div class="mstat ' + kind + '"><span class="ic">' + glyph + '</span>' +
        '<span class="lb2">' + label + '<small>' + signed(pts, 0) + ' คะแนนต่อข้อ</small></span>' +
        '<span class="num"><b>' + n + '</b> ข้อ<small>' + signed(n * pts, 0) + ' คะแนน</small></span></div>';
    }
    var h = '<section class="card section rise" style="--i:10"><div class="card-head"><div><h2>ปรนัยรายข้อ</h2>' +
      '<div class="sub">แตะหรือชี้ที่ข้อเพื่อดูเฉลยและสัดส่วนเพื่อนที่ตอบถูก · คะแนนปรนัยสูงสุด ' + fmt(m.cap, 0) + '</div></div>' +
      '<div class="pdf-bar"><button class="btn btn-ghost" id="mcqTbl" aria-pressed="false">ดูเป็นตาราง</button></div></div>' +
      '<div class="mcq-wrap"><div>' +
      '<div class="chips" id="mcqChips">' + m.items.map(function (i) {
        var tipText = 'ข้อ ' + i.no + '\n' + YOU() + 'ตอบ ' + (i.answer || 'ไม่ตอบ') + ' · เฉลย ' + (i.key || '–') + '\nคะแนนข้อนี้ ' + signed(i.points, 0) +
          (i.classCorrectPct != null ? '\nเพื่อนในห้องตอบถูก ' + i.classCorrectPct + '%' : '');
        return '<button class="q ' + i.result + '" data-tip="' + esc(tipText) + '" aria-label="ข้อ ' + i.no + ' ' + RESULT_TH[i.result] + '">' +

  function animate(root) {
    var counts = root.querySelectorAll('[data-count]');
    Array.prototype.forEach.call(counts, function (el) {
      var raw = el.getAttribute('data-count');
      if (raw === '') return;
      var to = parseFloat(raw), isInt = Math.floor(to) === to;
      if (reduceMotion) { el.textContent = fmt(to, isInt ? 0 : 2); return; }
      var t0 = null, dur = 900;
      function step(ts) {
        if (t0 == null) t0 = ts;
        var p = clamp((ts - t0) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(to * e, isInt ? 0 : 2);
        if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(to, isInt ? 0 : 2);
      }
      requestAnimationFrame(step);
    });
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        Array.prototype.forEach.call(root.querySelectorAll('[data-w]'), function (el) { el.style.width = el.getAttribute('data-w') + '%'; });
        Array.prototype.forEach.call(root.querySelectorAll('[data-ring]'), function (el) { el.style.strokeDashoffset = el.getAttribute('data-ring'); });
        Array.prototype.forEach.call(root.querySelectorAll('[data-left]'), function (el) { el.style.left = el.getAttribute('data-left') + '%'; });
      });
    });
  }

  function barPath(x, y, w, h) {
    var r = Math.min(4, h, w / 2);
    return 'M' + x + ',' + (y + h) + 'L' + x + ',' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
      'L' + (x + w - r) + ',' + y + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'L' + (x + w) + ',' + (y + h) + 'Z';
  }

  function drawHist() {
    var host = histCtx.host, dist = histCtx.dist, bins = dist.bins;
    if (!bins.length) { host.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }
    var W = Math.max(260, host.clientWidth || 520), H = 236;
    var m = { l: 30, r: 8, t: 30, b: 34 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    var maxC = Math.max.apply(null, bins.map(function (b) { return b.count; }));
    var step = Math.max(1, Math.ceil(Math.max(2, maxC) / 4)), ymax = step * Math.ceil(Math.max(2, maxC) / step);
    var band = iw / bins.length, bw = clamp(band - 8, 6, 24);
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="กราฟแท่งแสดงจำนวนนักศึกษาในแต่ละช่วงคะแนน">';
    for (var v = 0; v <= ymax; v += step) {
      var y = m.t + ih - (v / ymax) * ih;
      s += '<line class="' + (v === 0 ? 'base' : 'grid') + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y + '"/>' +
        '<text class="ytxt" x="' + (m.l - 8) + '" y="' + (y + 4) + '">' + v + '</text>';
    }
    bins.forEach(function (b, i) {
      var x0 = m.l + band * i, bx = x0 + (band - bw) / 2, h = (b.count / ymax) * ih, by = m.t + ih - h;
      var you = i === dist.you;
      var tipText = fmt(b.from, 0) + ' – ' + fmt(b.to, 0) + ' คะแนน\n' + b.count + ' คน' + (you ? '\nรวม' + YOU() : '');
      s += '<g tabindex="0" class="b" data-tip="' + esc(tipText) + '" aria-label="' + esc(tipText.replace(/\n/g, ' ')) + '">' +
        '<rect class="band" x="' + x0 + '" y="' + m.t + '" width="' + band + '" height="' + ih + '" rx="6"/>' +
        (b.count > 0 ? '<path d="' + barPath(bx, by, bw, h) + '" style="fill:' + (you ? 'var(--accent)' : 'var(--bar-muted)') + '"/>' : '') +
        (you ? '<text class="you-tag" x="' + (bx + bw / 2) + '" y="' + (by - 9) + '">' + YOU() + '</text>' : '') +
        '<rect class="hit" x="' + x0 + '" y="' + m.t + '" width="' + band + '" height="' + ih + '"/></g>';
    });
    var every = band < 38 ? 2 : 1;
    for (var k = 0; k <= bins.length; k++) {
      if (k % every !== 0 && k !== bins.length) continue;
      var lx = m.l + band * k, val = k < bins.length ? bins[k].from : bins[bins.length - 1].to + 1;
      s += '<text x="' + lx + '" y="' + (H - 12) + '" text-anchor="middle">' + fmt(val, 0) + '</text>';
    }
    s += '</svg>';
    host.innerHTML = s;
  }

  /* ---------- PDF ---------- */

  var PDFJS_VER = '3.11.174';
  var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VER + '/pdf.min.js';
  var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VER + '/pdf.worker.min.js';

  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = function () { rej(new Error('script')); };
      document.head.appendChild(s);
    });
  }
  function ensurePdfJs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    return loadScript(PDFJS_URL).then(function () {
      var lib = window.pdfjsLib;
      return fetch(PDFJS_WORKER).then(function (r) { return r.text(); }).then(function (code) {
        lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        return lib;
      }).catch(function () { lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return lib; });
    });
  }
  function b64ToBytes(b64) {
    var bin = atob(b64), n = bin.length, out = new Uint8Array(n);
    for (var i = 0; i < n; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function setupPdf() {
    var card = document.getElementById('pdfCard');
    var started = false;
    function start() { if (started) return; started = true; loadPdf(); }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io.disconnect(); start(); } }, { rootMargin: '400px' });
      io.observe(card);
    } else start();
  }

  function pdfError(msg, bytes, name) {
    var stage = document.getElementById('pdfStage');
    if (!stage) return;
    stage.innerHTML = '<div class="empty">' + esc(msg) + '<div style="margin-top:14px;display:flex;gap:10px;justify-content:center">' +
      '<button class="btn btn-ghost" id="pdfRetry">ลองอีกครั้ง</button>' +
      (bytes ? '<button class="btn btn-ghost" id="pdfDl">ดาวน์โหลดไฟล์</button>' : '') + '</div></div>';
    document.getElementById('pdfRetry').addEventListener('click', function () {
      stage.innerHTML = '<div class="sk" style="height:300px;width:100%"></div>';
      loadPdf();
    });
    if (bytes) document.getElementById('pdfDl').addEventListener('click', function () { downloadBytes(bytes, name); });
  }

  function downloadBytes(bytes, name) {
    var url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    var a = document.createElement('a');
    a.href = url; a.download = name || 'score.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function pdfScope() { return state.adminView ? 'a:' + state.adminView.idKey : 't:' + state.token; }

  function loadPdf() {
    var scope = pdfScope();
    var req = state.adminView ? callApi('api_adminPdf', state.admin.token, state.adminView.idKey) : callApi('api_pdf', state.token);
    req.then(function (r) {
      if (scope !== pdfScope()) return;
      if (!r || !r.ok) {
        if (r && r.expired) {
          if (state.adminView) return adminExpired();
          clearSession(); return renderAuth('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง', 'info');
        }
        return pdfError((r && r.error) || NET_ERR);
      }
      var bytes = b64ToBytes(r.base64);
      var nameEl = document.getElementById('pdfName');
      if (nameEl) nameEl.textContent = r.name;
      return ensurePdfJs().then(function (lib) {
        return lib.getDocument({ data: bytes.slice() }).promise;
      }).then(function (doc) {
        mountPdf(doc, bytes, r.name);
      }).catch(function () {
        pdfError('แสดงตัวอย่างไฟล์ในหน้านี้ไม่สำเร็จ (ดาวน์โหลดไฟล์เพื่อเปิดดูได้)', bytes, r.name);
      });
    }).catch(function () { pdfError(NET_ERR); });
  }

  function mountPdf(doc, bytes, name) {
    var stage = document.getElementById('pdfStage');
    if (!stage || !stage.isConnected) return;
    var pages = [], zoom = 1, io = null;
    var base = Math.min(stage.clientWidth - 28, 900);
    stage.innerHTML = '';
    document.getElementById('pdfBar').hidden = false;

    function layout() {
      pages.forEach(function (p) {
        var w = base * zoom;
        p.el.style.width = w + 'px';
        p.el.style.height = (w * p.ratio) + 'px';
        var c = p.el.querySelector('canvas');
        if (c) c.remove();
        p.done = false;
        if (io) { io.unobserve(p.el); io.observe(p.el); }
      });
      document.getElementById('zVal').textContent = Math.round(zoom * 100) + '%';
    }
    function render(p) {
      if (p.done || p.busy) return;
      p.busy = true;
      var cssW = p.el.clientWidth, vp0 = p.page.getViewport({ scale: 1 });
      var vp = p.page.getViewport({ scale: (cssW / vp0.width) * Math.min(window.devicePixelRatio || 1, 2) });
      var cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      p.page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function () {
        p.el.insertBefore(cv, p.el.firstChild);
        p.done = true; p.busy = false;
      }).catch(function () { p.busy = false; });
    }

    var tasks = [];
    for (var i = 1; i <= doc.numPages; i++) tasks.push(doc.getPage(i));
    Promise.all(tasks).then(function (list) {
      list.forEach(function (page, idx) {
        var vp = page.getViewport({ scale: 1 });
        var el = document.createElement('div');
        el.className = 'pg';
        el.innerHTML = '<span class="pn">หน้า ' + (idx + 1) + ' / ' + list.length + '</span>';
        stage.appendChild(el);
        pages.push({ page: page, el: el, ratio: vp.height / vp.width, done: false, busy: false });
      });
      if ('IntersectionObserver' in window) {
        io = new IntersectionObserver(function (es) {
          es.forEach(function (e) {
            if (!e.isIntersecting) return;
            var p = pages.filter(function (q) { return q.el === e.target; })[0];
            if (p) render(p);
          });
        }, { root: stage, rootMargin: '600px' });
      }
      layout();
      if (!io) pages.forEach(render);
    });

    document.getElementById('zIn').onclick = function () { zoom = Math.min(3, zoom + 0.25); layout(); if (!io) pages.forEach(render); };
    document.getElementById('zOut').onclick = function () { zoom = Math.max(0.5, zoom - 0.25); layout(); if (!io) pages.forEach(render); };
    document.getElementById('dlBtn').onclick = function () { downloadBytes(bytes, name); };
  }

    h += '<div class="hero adm">' +
      '<section class="card rise" style="--i:0"><div class="kicker">สถานะการประกาศ</div>' +
        '<div style="margin:12px 0 10px">' + (o.published ? badge('ok', ICON.check, 'เปิดประกาศผลแล้ว') : badge('warn', ICON.lock, 'ยังล็อกอยู่ — นักศึกษายังไม่เห็นคะแนน')) + '</div>' +
        '<p class="lead">คะแนนรวมที่ใช้จัดอันดับ: <b>' + esc(o.totalNote || 'ตามที่ข้อสอบกำหนด') + '</b></p>' +
        '<p class="lead" style="margin-top:8px;font-size:13px">เปิด/ปิดประกาศผลที่เมนู Score Portal ในชีตฐานข้อมูล</p></section>' +
      '<section class="card rise" style="--i:1"><div class="kicker">การลงทะเบียนของนักศึกษา</div>' +
        '<div class="rank-fig"><b class="bigfig" data-count="' + o.registered + '">0</b><span>จาก ' + n + ' คน</span></div>' +
        meter(o.registered, n, null, null) +
        '<p class="lead" style="margin-top:12px">ยังไม่ลงทะเบียน <b>' + (n - o.registered) + '</b> คน</p></section>' +
      '<section class="card rise" style="--i:2"><div class="kicker">ตรวจข้อมูล</div>' +
        '<div style="margin:12px 0 10px;display:flex;gap:8px;flex-wrap:wrap">' +
          (noPdf ? badge('bad', ICON.x, 'ไม่พบ PDF ' + noPdf + ' คน') : badge('ok', ICON.check, 'PDF ครบทุกคน')) +
          (warns.length ? badge('warn', ICON.alert, 'คำเตือน ' + warns.length + ' ข้อ') : badge('ok', ICON.check, 'ไม่มีคำเตือน')) + '</div>' +
        (warns.length ? '<details class="wq" style="margin-top:0"><summary style="padding:10px 12px"><span class="t">' + ICON.chev + 'ดูคำเตือน</span></summary><div class="rub"><ul class="fb">' +
          warns.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div></details>' : '') +
      '</section></div>';

    h += '<div class="two"><section class="card rise" style="--i:3"><div class="card-head"><div><h2>การกระจายคะแนนของห้อง</h2>' +
      '<div class="sub">จำนวนนักศึกษาในแต่ละช่วงคะแนนรวม (ช่วงละ ' + o.distribution.width + ' คะแนน)</div></div>' +
      '<div class="pdf-bar"><button class="btn btn-ghost" id="histTbl" aria-pressed="false">ดูเป็นตาราง</button></div></div>' +
      '<div class="chart" id="hist"></div><div id="histTable" hidden></div></section>' +
      '<section class="card rise" style="--i:4"><div class="kicker">สถิติทั้งห้อง</div><div class="stats">' +
      [['ค่าเฉลี่ย', st.mean], ['มัธยฐาน', st.median], ['สูงสุด', st.max], ['ต่ำสุด', st.min], ['ส่วนเบี่ยงเบนมาตรฐาน', st.sd], ['ผู้เข้าสอบ', st.n]]
        .map(function (x) { return '<div class="stat"><span>' + x[0] + '</span><b>' + (x[0] === 'ผู้เข้าสอบ' ? fmt(x[1], 0) + ' คน' : fmt(x[1])) + '</b></div>'; }).join('') +
      '</div></section></div>';

    h += '<section class="card section rise" style="--i:5"><div class="card-head"><div><h2>รายชื่อนักศึกษา <span id="admCount" style="color:var(--muted);font-weight:400"></span></h2>' +
      '<div class="sub">คลิกแถวเพื่อดูหน้าของนักศึกษาคนนั้นเหมือนที่เจ้าตัวเห็น (รวม PDF) · คลิกหัวคอลัมน์เพื่อเรียง</div></div>' +
      '<div class="tools"><input class="input" id="admQ" type="search" placeholder="ค้นหาชื่อ หรือรหัสนักศึกษา" aria-label="ค้นหานักศึกษา" autocomplete="off">' +
      '<button class="btn btn-ghost" id="admCsv">ส่งออก CSV</button><button class="btn btn-ghost" id="admRefresh">รีเฟรช</button></div></div>' +
      '<div class="tbl-wrap"><table class="tbl" id="admTbl"><thead><tr>' +
      ADM_COLS.map(function (c) { return '<th scope="col" data-sort="' + c.k + '"' + (c.num ? ' class="num"' : '') + ' tabindex="0">' + c.t + '<span class="si"></span></th>'; }).join('') +
      '</tr></thead><tbody id="admBody"></tbody></table></div>' +
      '<p class="fine" style="text-align:left">ข้อมูลคะแนนถูกแคชไว้ประมาณ 5 นาที ถ้าเพิ่งแก้ชีตให้ใช้เมนู ล้างแคช แล้วกดรีเฟรช</p></section>';
    h += '</main><p class="foot">ข้อมูล ณ ' + esc(new Date(o.builtAt).toLocaleString('th-TH')) + '</p>';

    app.innerHTML = h;
    wireTopbar();
    animate(app);
    setupHist({ distribution: o.distribution });

    var q = document.getElementById('admQ');
    q.value = state.adminUi.q;
    q.addEventListener('input', function () { state.adminUi.q = q.value; renderAdminRows(); });
    q.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { var rows = adminRows(); if (rows.length === 1) openStudent(rows[0].idKey); }
    });
    document.getElementById('admRefresh').addEventListener('click', loadAdminOverview);
    document.getElementById('admCsv').addEventListener('click', function () { exportCsv(adminRows()); });
    var thead = document.querySelector('#admTbl thead');
    function sortBy(th) {
      if (!th) return;
      var k = th.getAttribute('data-sort'), u = state.adminUi;
      if (u.key === k) u.dir = -u.dir; else { u.key = k; u.dir = 1; }
      renderAdminRows();
    }
    thead.addEventListener('click', function (e) { sortBy(e.target.closest('th')); });
    thead.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(e.target.closest('th')); } });
    var body = document.getElementById('admBody');
    body.addEventListener('click', function (e) { var tr = e.target.closest('tr[data-id]'); if (tr) openStudent(tr.getAttribute('data-id')); });
    body.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var tr = e.target.closest('tr[data-id]'); if (tr) openStudent(tr.getAttribute('data-id'));
    });
    renderAdminRows();
  }

  function adminRows() {
    var u = state.adminUi, rows = state.adminData.rows;
    var q = u.q.trim().toLowerCase().replace(/\s+/g, ''), qd = u.q.replace(/\D/g, '');
    if (q) {
      rows = rows.filter(function (r) {
        return r.name.toLowerCase().replace(/\s+/g, '').indexOf(q) !== -1 ||
          (qd.length >= 3 && r.idKey.indexOf(qd) !== -1) || String(r.seq) === q;
      });
    }
    var k = u.key, dir = u.dir;
    return rows.slice().sort(function (a, b) {
      var x = a[k], y = b[k];
      if (typeof x === 'boolean') x = x ? 1 : 0;
      if (typeof y === 'boolean') y = y ? 1 : 0;
      var nx = x == null, ny = y == null;
      if (nx || ny) return nx && ny ? 0 : nx ? 1 : -1; // ค่าว่างอยู่ท้ายเสมอ
      var c = typeof x === 'string' ? x.localeCompare(y, 'th') : x - y;
      return c * dir || a.seq - b.seq;
    });
  }

  function renderAdminRows() {
    var rows = adminRows(), u = state.adminUi;
    var max = state.adminData.max;
    document.getElementById('admCount').textContent = '(' + rows.length + ' / ' + state.adminData.rows.length + ' คน)';
    Array.prototype.forEach.call(document.querySelectorAll('#admTbl th'), function (th) {
      var on = th.getAttribute('data-sort') === u.key;
      th.querySelector('.si').textContent = on ? (u.dir > 0 ? '▲' : '▼') : '';
      th.setAttribute('aria-sort', on ? (u.dir > 0 ? 'ascending' : 'descending') : 'none');
    });
    document.getElementById('admBody').innerHTML = rows.length ? rows.map(function (r) {
      return '<tr tabindex="0" data-id="' + esc(r.idKey) + '" aria-label="ดูข้อมูลของ ' + esc(r.name) + '">' +
        '<td class="num">' + r.seq + '</td><td>' + esc(r.id) + '</td><td>' + esc(r.name) + '</td>' +
        '<td class="num">' + fmt(r.mcq) + '</td><td class="num">' + fmt(r.q1) + '</td><td class="num">' + fmt(r.q2) + '</td><td class="num">' + fmt(r.q3) + '</td>' +
        '<td class="num">' + fmt(r.written) + '</td><td class="num"><b>' + fmt(r.total) + '</b></td><td class="num">' + (r.rank == null ? '–' : r.rank) + '</td>' +
        '<td>' + (r.registered ? badge('ok', ICON.check, 'แล้ว') : badge('', ICON.dash, 'ยัง')) + '</td>' +
        '<td>' + (r.pdf == null ? '–' : r.pdf ? badge('ok', ICON.check, 'มี') : badge('bad', ICON.x, 'ไม่พบ')) + '</td></tr>';
    }).join('') : '<tr><td colspan="' + ADM_COLS.length + '" class="empty">ไม่พบนักศึกษาที่ตรงกับคำค้น</td></tr>';
  }

  function csvCell(v, isText) {
    if (v == null) return '';
    var s = String(v);
    if (isText && /^[=+\-@\t\r]/.test(s)) s = "'" + s; // กัน CSV/สูตร injection เมื่อเปิดใน Excel
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCsv(rows) {
    var head = ['ลำดับ', 'รหัสนักศึกษา', 'ชื่อ-สกุล', 'กลุ่ม', 'ปรนัย', 'อัตนัยข้อ 1', 'อัตนัยข้อ 2', 'อัตนัยข้อ 3', 'อัตนัยรวม', 'คะแนนรวม', 'อันดับ', 'ลงทะเบียน', 'มี PDF'];
    var lines = [head.join(',')];
    rows.forEach(function (r) {
      lines.push([csvCell(r.seq), csvCell(r.id, true), csvCell(r.name, true), csvCell(r.group, true), csvCell(r.mcq), csvCell(r.q1), csvCell(r.q2), csvCell(r.q3),
        csvCell(r.written), csvCell(r.total), csvCell(r.rank), r.registered ? 'ลงทะเบียนแล้ว' : 'ยังไม่ลงทะเบียน',
        r.pdf == null ? '' : r.pdf ? 'มี' : 'ไม่พบ'].join(','));
    });
    var bytes = new TextEncoder().encode('﻿' + lines.join('\r\n'));
    var url = URL.createObjectURL(new Blob([bytes], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url; a.download = 'score-summary.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function openStudent(idKey) {
    renderLoading();
    callApi('api_adminStudent', state.admin.token, idKey).then(function (r) {
      if (!r || !r.ok) {
        if (r && r.expired) return adminExpired();
        return renderAdminOverview(state.adminData, (r && r.error) || NET_ERR);
      }
      state.adminView = { idKey: idKey, id: r.data.student.id, name: r.data.student.name, registered: r.registered, published: r.published };
      state.course = r.course;
      renderDashboard(r.data);
      window.scrollTo(0, 0);
    }).catch(function () { renderAdminOverview(state.adminData, NET_ERR); });
  }

  /* ---------- เริ่มต้น ---------- */

  if (BOOT.admin) {
    var savedAdmin = store.get('sp_atoken');
    if (savedAdmin && savedAdmin.length === 64) { state.admin = { token: savedAdmin }; loadAdminOverview(); }
    else renderAdminAuth();
  } else {
    var saved = store.get('sp_token');
    if (saved && saved.length === 64) { state.token = saved; loadDashboard(); }
    else renderAuth();
  }
})();
</script>
</body>
</html>
